<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>隔熱紙工單</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f4f6;--card:#fff;--tx:#111827;--mu:#6b7280;--ac:#2563eb;--acx:#fff;--bd:#d1d5db;--dg:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1115;--card:#1a1d24;--tx:#f3f4f6;--mu:#9ca3af;--ac:#3b82f6;--acx:#fff;--bd:#374151;--dg:#f87171}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1115;--card:#1a1d24;--tx:#f3f4f6;--mu:#9ca3af;--ac:#3b82f6;--acx:#fff;--bd:#374151;--dg:#f87171}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;padding-bottom:90px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--bd);padding:12px 14px;display:flex;align-items:center;gap:8px;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
main{padding:12px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:var(--acx);min-height:44px}
button.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button.d{background:transparent;color:var(--dg);border:1px solid var(--dg)}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);min-height:44px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border:1px solid var(--bd);border-radius:20px;background:var(--bg)}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.win{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
.win.on{border-color:var(--ac)}
.wh{display:flex;align-items:center;gap:8px;font-weight:600}
.wh input[type=checkbox]{width:24px;min-height:24px;height:24px}
.wh input.nm{font-weight:600}
.sub{text-align:right;color:var(--ac);font-weight:700;margin-top:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:6}
.bar>*{flex:1;padding:10px 4px}
.tot{font-size:20px;font-weight:800;text-align:right}
.mu{color:var(--mu);font-size:13px}
.rh{display:block;font-size:17px;font-weight:700;letter-spacing:.5px;margin-bottom:6px;padding-left:10px;border-left:4px solid currentColor;line-height:1.3}
#sheet{position:fixed;left:-9999px;top:0;width:640px;background:#fff;color:#000;padding:30px;font:15px/1.5 "PingFang TC","Noto Sans TC",sans-serif}
#sheet table{width:100%;border-collapse:collapse;margin-top:10px}
#sheet th,#sheet td{border:1px solid #999;padding:6px;text-align:left}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
svg.dg{width:100%;max-width:420px;height:auto;display:block;margin:8px auto;overflow:hidden}
.card{overflow:hidden;max-width:100%}
html,body{overflow-x:hidden;max-width:100%}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;width:100%;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-calendar-picker-indicator{margin:0}
.dg .bd{fill:none;stroke:var(--bd);stroke-width:2}
.dg .pw{fill:rgba(128,128,128,.12);stroke:var(--mu);stroke-width:1.5;cursor:pointer}
.dg .pw.on{stroke:#22c55e;fill:rgba(34,197,94,.2);stroke-width:2.5}
.dg text{fill:var(--tx);font-size:10px;text-anchor:middle;pointer-events:none}
.logo{height:34px;width:auto;flex:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:invert(1)}}
:root[data-theme="dark"] .logo{filter:invert(1)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>

let rm=today().slice(0,7),RP;
function shiftM(d){const [y,m]=rm.split('-').map(Number);const dt=new Date(y,m-1+d,1);rm=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');report()}
function report(){
 const os=S.orders.filter(o=>(o.date||'').startsWith(rm));
 let mat=0,cai=0,tr=0,rem=0,ex=0,tot=0,cost=0;const by={},vt={};
 os.forEach(o=>{const t=total(o);tot+=t;tr+=+o.travel||0;rem+=+o.removal||0;ex+=+o.extra||0;
  const v=vt[o.type]=vt[o.type]||{n:0,s:0};v.n++;v.s+=t;
  o.windows.filter(w=>w.on).forEach(w=>{const c=+w.cai||0,a=c*(+w.price||0);mat+=a;cai+=c;cost+=c*(+w.cost||0);
   const k=w.film+(w.model?' '+w.model:'');const b=by[k]=by[k]||{n:0,c:0,s:0};b.n++;b.c+=c;b.s+=a})});
 const r1=n=>Math.round(n*10)/10;RP={rm,os,tot,cai,mat,tr,rem,ex,by,vt,cost};
 const ln=(a,b)=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0"><span>${a}</span><b>${b}</b></div>`;
 const rows=(obj,f)=>Object.entries(obj).sort((a,b)=>b[1].s-a[1].s).map(f).join('')||'<div class="mu">本月沒有資料</div>';
 $('#app').innerHTML=`<header><button class="s" onclick="go('list')">‹ 返回</button><h1>月報</h1></header><main>
 <div class="card"><div class="row"><button class="s" style="flex:0 0 52px" onclick="shiftM(-1)">‹</button><input type="month" value="${rm}" onchange="if(this.value){rm=this.value;report()}" style="text-align:center"><button class="s" style="flex:0 0 52px" onclick="shiftM(1)">›</button></div></div>

 <div class="card"><b class="rh" style="color:#fbbf24">各品牌 / 型號用量</b>${rows(by,([k,b])=>`<div style="padding:6px 0;border-top:1px solid var(--bd)">${ln(esc(k),money(b.s))}<div class="mu">${r1(b.c)} 才　${b.n} 片窗</div></div>`)}</div>
 <div class="card"><b class="rh" style="color:#a78bfa">發票明細</b>${[...os].sort((a,b)=>a.date.localeCompare(b.date)||a.no.localeCompare(b.no)).map(o=>`<div style="padding:6px 0;border-top:1px solid var(--bd)"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(o.inv||'（未填發票）')}</b><b>${money(total(o))}</b></div><div class="mu">${esc(o.date)}　${esc(o.no)}　${esc(o.customer)}</div></div>`).join('')||'<div class="mu">本月沒有資料</div>'}</div>

async function reportPdf(){
 if(!window.html2canvas||!window.jspdf){alert('PDF 元件尚未載入，請檢查網路後再試');return}
 const R_=RP,r1=n=>Math.round(n*10)/10;
 const tb=(h,rs)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rs.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;
 const inv=[...R_.os].sort((a,b)=>a.date.localeCompare(b.date)||a.no.localeCompare(b.no));
 $('#sheet').innerHTML=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:6px"><img src="${LOGO}" style="height:60px"><h2 style="margin:0">弘越隔熱紙月報　${esc(R_.rm)}</h2></div><div>工單 ${R_.os.length} 筆　總才數 ${r1(R_.cai)} 才　營收 ${money(R_.tot)}（未扣成本）</div>
 <h3>收入組成</h3>${tb(['項目','金額'],[['貼膜材料與施工',money(R_.mat)],['交通費',money(R_.tr)],['拆舊紙',money(R_.rem)],['其他費用 / 工資',money(R_.ex)],['合計',money(R_.tot)],['材料成本',money(R_.cost)],['扣除成本後營收',money(R_.tot-R_.cost)]])}
 <h3>各品牌／型號用量</h3>${tb(['品牌／型號','才數','窗數','金額'],Object.entries(R_.by).sort((a,b)=>b[1].s-a[1].s).map(([k,b])=>[esc(k),r1(b.c),b.n,money(b.s)]))}
 <h3>各車種</h3>${tb(['車種','筆數','金額'],Object.entries(R_.vt).sort((a,b)=>b[1].s-a[1].s).map(([k,v])=>[esc(k),v.n,money(v.s)]))}
 <h3>發票明細</h3>${tb(['日期','工單編號','客戶','發票號碼','金額'],inv.map(o=>[esc(o.date),esc(o.no),esc(o.customer),esc(o.inv||'未填'),money(total(o))]).concat([['','','','合計',money(R_.tot)]]))}`;
 try{
  const c=await h2c();
  const p=new jspdf.jsPDF('p','mm','a4'),pw=190,ph=277,pc=Math.floor(c.width*ph/pw);
  for(let y=0,g=0;y<c.height;y+=pc,g++){
   const s=document.createElement('canvas');s.width=c.width;s.height=Math.min(pc,c.height-y);
   s.getContext('2d').drawImage(c,0,y,c.width,s.height,0,0,c.width,s.height);
   if(g)p.addPage();
   p.addImage(s.toDataURL('image/jpeg',.92),'JPEG',10,10,pw,s.height*pw/c.width)}
  await deliverPdf(p,`月報_${R_.rm}.pdf`);
 }catch(e){if(e.name!=='AbortError')alert('匯出失敗：'+((e&&e.message)||e))}
}

 d.innerHTML=`<div style="background:var(--card);width:100%;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));border-radius:16px 16px 0 0"><div style="font-weight:700;margin-bottom:4px">PDF 已產生</div><div class="mu" style="margin-bottom:12px;word-break:break-all">${esc(name)}</div><div style="display:flex;flex-direction:column;gap:8px"><button id="psShare">分享 / 傳送（LINE、Email…）</button><a id="psOpen" href="${url}" target="_blank" rel="noopener" style="text-align:center;padding:12px;border:1px solid var(--ac);border-radius:10px;color:var(--ac);text-decoration:none">開啟 PDF 預覽</a><a id="psDl" href="${url}" download="${esc(name)}" style="text-align:center;padding:12px;border:1px solid var(--ac);border-radius:10px;color:var(--ac);text-decoration:none">下載 PDF</a><button class="s" onclick="closePs()">關閉</button></div></div>`;
 document.body.appendChild(d);
 document.getElementById('psShare').onclick=async()=>{try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:name});else alert('這個瀏覽器不支援直接分享，請改用下方「開啟 PDF 預覽」或「下載 PDF」')}catch(e){if(e.name!=='AbortError')alert('分享失敗：'+e.message)}}}
async function deliverPdf(p,name){
 const blob=p.output('blob'),f=new File([blob],name,{type:'application/pdf'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e.name==='AbortError')return}
 showPdfSheet(blob,f,name)}
async function pdf(){
 if(!window.html2canvas||!window.jspdf){alert('PDF 元件尚未載入，請檢查網路後再試');return}
 const o=cur,ws=o.windows.filter(w=>w.on);
 $('#sheet').innerHTML=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px"><img src="${LOGO}" style="height:60px"><h2 style="margin:0">弘越隔熱紙 施工單</h2></div>
 <div>客戶：${esc(o.customer)}　電話：${esc(o.phone)}${o.lineId?'　LINE ID：'+esc(o.lineId):''}</div><div>編號：${esc(o.no)}　日期：${esc(o.date)}${o.inv?'　發票：'+esc(o.inv):''}</div><div>${esc(o.type)}：${esc(vehLabel(o))} ${esc(o.subject)}</div>
 <table><tr><th>窗戶</th><th>貼紙</th><th>才數</th><th>單價</th><th>小計</th></tr>
 ${ws.map(w=>`<tr><td>${esc(w.name)}</td><td>${esc(w.film)} ${esc(w.model)} ${w.pct?esc(w.pct)+'%':''}</td><td>${esc(w.cai)}</td><td>${esc(w.price)}</td><td>${money(w.cai*w.price)}</td></tr>`).join('')}
 ${o.travel?`<tr><td colspan="4">交通費</td><td>${money(o.travel)}</td></tr>`:''}${o.removal?`<tr><td colspan="4">拆舊紙</td><td>${money(o.removal)}</td></tr>`:''}${o.extra?`<tr><td colspan="4">其他費用 / 工資</td><td>${money(o.extra)}</td></tr>`:''}
 <tr><th colspan="4">合計</th><th>${money(total(o))}</th></tr></table>${WARR[o.type]?`<p style="margin:10px 0 0"><b>保固：${WARR[o.type]} 年</b>（自 ${esc(o.date)} 起算）</p>`:''}${o.note?`<p>備註：${esc(o.note)}</p>`:''}`;
 try{
  const c=await h2c();
  const p=new jspdf.jsPDF('p','mm','a4');
  let w=190,h=c.height*w/c.width;if(h>277){w=w*277/h;h=277}
  p.addImage(c.toDataURL('image/jpeg',.92),'JPEG',10,10,w,h);
  await deliverPdf(p,`${o.no}_${o.customer||'未命名'}.pdf`);
 }catch(e){if(e.name!=='AbortError')alert('匯出失敗：'+((e&&e.message)||e)+'\n可改用 LINE / Email 傳送文字版')}
}
R();
</script>
