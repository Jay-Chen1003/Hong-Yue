<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>隔熱紙工單</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f4f6;--card:#fff;--tx:#111827;--mu:#6b7280;--ac:#2563eb;--acx:#fff;--bd:#d1d5db;--dg:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1115;--card:#1a1d24;--tx:#f3f4f6;--mu:#9ca3af;--ac:#3b82f6;--acx:#fff;--bd:#374151;--dg:#f87171}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1115;--card:#1a1d24;--tx:#f3f4f6;--mu:#9ca3af;--ac:#3b82f6;--acx:#fff;--bd:#374151;--dg:#f87171}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;padding-bottom:90px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--bd);padding:12px 14px;display:flex;align-items:center;gap:8px;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
main{padding:12px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:var(--acx);min-height:44px}
button.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button.d{background:transparent;color:var(--dg);border:1px solid var(--dg)}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);min-height:44px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border:1px solid var(--bd);border-radius:20px;background:var(--bg)}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.win{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
.win.on{border-color:var(--ac)}
.wh{display:flex;align-items:center;gap:8px;font-weight:600}
.wh input[type=checkbox]{width:24px;min-height:24px;height:24px}
.wh input.nm{font-weight:600}
.sub{text-align:right;color:var(--ac);font-weight:700;margin-top:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:6}
.bar>*{flex:1;padding:10px 4px}
.tot{font-size:20px;font-weight:800;text-align:right}
.mu{color:var(--mu);font-size:13px}
.rh{display:block;font-size:17px;font-weight:700;letter-spacing:.5px;margin-bottom:6px;padding-left:10px;border-left:4px solid currentColor;line-height:1.3}
#sheet{position:fixed;left:-9999px;top:0;width:640px;background:#fff;color:#000;padding:30px;font:15px/1.5 "PingFang TC","Noto Sans TC",sans-serif}
#sheet table{width:100%;border-collapse:collapse;margin-top:10px}
#sheet th,#sheet td{border:1px solid #999;padding:6px;text-align:left}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
svg.dg{width:100%;max-width:420px;height:auto;display:block;margin:8px auto;overflow:hidden}
.card{overflow:hidden;max-width:100%}
html,body{overflow-x:hidden;max-width:100%}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;width:100%;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-calendar-picker-indicator{margin:0}
.dg .bd{fill:none;stroke:var(--bd);stroke-width:2}
.dg .pw{fill:rgba(128,128,128,.12);stroke:var(--mu);stroke-width:1.5;cursor:pointer}
.dg .pw.on{stroke:#22c55e;fill:rgba(34,197,94,.2);stroke-width:2.5}
.dg text{fill:var(--tx);font-size:10px;text-anchor:middle;pointer-events:none}
.logo{height:34px;width:auto;flex:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:invert(1)}}
:root[data-theme="dark"] .logo{filter:invert(1)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>

function diagram(o){const T=TPL[o.type];
 return `<svg class="dg" viewBox="${VBX[o.type]}">${BG[o.type]}${o.windows.map((w,i)=>{const t=w.t!=null&&T[w.t];if(!t)return '';
  return `<g onclick="tog(${i},${!w.on})"><polygon class="pw ${w.on?'on':''}" points="${t.p}"/>`+(t.v?`<text transform="rotate(-90 ${t.lx} ${t.ly})" x="${t.lx}" y="${t.ly+4}">${esc(w.name)}</text>`:`<text x="${t.lx}" y="${t.ly}">${esc(w.name)}</text>`+(w.on?(t.b?`<text id="l${i}" x="${t.lx}" y="${t.ly+15}" style="fill:#22c55e;font-weight:700">${lbt(w)}</text>`:`<circle cx="${t.lx}" cy="${t.ly+13}" r="4" fill="#22c55e"/>`):''))+'</g>'}).join('')}</svg>`}
function setType(t){
 if(t===cur.type)return;
 if(cur.windows.some(w=>w.on)&&!confirm('切換類型會清除已選的窗戶，確定嗎？'))return;
 cur.type=t;cur.brand='';cur.model='';cur.brandT='';cur.modelT='';cur.windows=TPL[t].map(mk);edit_keep();
}
function addw(){const w=mk('窗戶'+(cur.windows.length+1));w.custom=true;w.on=true;cur.windows.push(w);edit_keep()}
function delw(i){cur.windows.splice(i,1);edit_keep()}
function saveO(){
 delete cur.bk;
 cur.windows.forEach(w=>{w.on=!!w.on});
 const i=S.orders.findIndex(o=>o.id===cur.id);
 if(i>=0)S.orders[i]=cur;else S.orders.push(cur);
 save();go('list');
}
function del(){if(confirm('確定刪除這筆工單？')){S.orders=S.orders.filter(o=>o.id!==cur.id);save();go('list')}}

let rm=today().slice(0,7),RP;
function shiftM(d){const [y,m]=rm.split('-').map(Number);const dt=new Date(y,m-1+d,1);rm=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');report()}
function report(){
 const os=S.orders.filter(o=>(o.date||'').startsWith(rm));
 let mat=0,cai=0,tr=0,rem=0,ex=0,tot=0,cost=0;const by={},vt={};
 os.forEach(o=>{const t=total(o);tot+=t;tr+=+o.travel||0;rem+=+o.removal||0;ex+=+o.extra||0;
  const v=vt[o.type]=vt[o.type]||{n:0,s:0};v.n++;v.s+=t;
  o.windows.filter(w=>w.on).forEach(w=>{const c=+w.cai||0,a=c*(+w.price||0);mat+=a;cai+=c;cost+=c*(+w.cost||0);
   const k=w.film+(w.model?' '+w.model:'');const b=by[k]=by[k]||{n:0,c:0,s:0};b.n++;b.c+=c;b.s+=a})});
 const r1=n=>Math.round(n*10)/10;RP={rm,os,tot,cai,mat,tr,rem,ex,by,vt,cost};
 const ln=(a,b)=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0"><span>${a}</span><b>${b}</b></div>`;
 const rows=(obj,f)=>Object.entries(obj).sort((a,b)=>b[1].s-a[1].s).map(f).join('')||'<div class="mu">本月沒有資料</div>';
 $('#app').innerHTML=`<header><button class="s" onclick="go('list')">‹ 返回</button><h1>月報</h1></header><main>
 <div class="card"><div class="row"><button class="s" style="flex:0 0 52px" onclick="shiftM(-1)">‹</button><input type="month" value="${rm}" onchange="if(this.value){rm=this.value;report()}" style="text-align:center"><button class="s" style="flex:0 0 52px" onclick="shiftM(1)">›</button></div></div>
 <div class="card"><div class="rh" style="color:#4ade80">本月營收（未扣成本）</div><div class="tot" style="text-align:left">${money(tot)}</div>
 <div class="row" style="margin-top:10px"><div><div class="mu">工單數</div><b>${os.length} 筆</b></div><div><div class="mu">總才數</div><b>${r1(cai)} 才</b></div><div><div class="mu">平均每筆</div><b>${money(os.length?tot/os.length:0)}</b></div></div></div>
 <div class="card"><div class="rh" style="color:#f472b6">扣除成本後營收</div><div class="tot" style="text-align:left">${money(tot-cost)}</div><div style="margin-top:6px">${ln('本月營收',money(tot))}${ln('材料成本',money(cost))}</div><div class="mu">成本 = 各窗戶「才數 × 成本/才」，不含交通費與工資等其他支出</div></div>
 <div class="card"><b class="rh" style="color:#2dd4bf">收入組成</b>${ln('貼膜材料與施工',money(mat))}${ln('交通費',money(tr))}${ln('拆舊紙',money(rem))}${ln('其他費用 / 工資',money(ex))}</div>
 <div class="card"><b class="rh" style="color:#fbbf24">各品牌 / 型號用量</b>${rows(by,([k,b])=>`<div style="padding:6px 0;border-top:1px solid var(--bd)">${ln(esc(k),money(b.s))}<div class="mu">${r1(b.c)} 才　${b.n} 片窗</div></div>`)}</div>
 <div class="card"><b class="rh" style="color:#a78bfa">發票明細</b>${[...os].sort((a,b)=>a.date.localeCompare(b.date)||a.no.localeCompare(b.no)).map(o=>`<div style="padding:6px 0;border-top:1px solid var(--bd)"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(o.inv||'（未填發票）')}</b><b>${money(total(o))}</b></div><div class="mu">${esc(o.date)}　${esc(o.no)}　${esc(o.customer)}</div></div>`).join('')||'<div class="mu">本月沒有資料</div>'}</div>
 <div class="card"><b class="rh" style="color:#60a5fa">各車種</b>${rows(vt,([k,v])=>ln('<span style="font-size:18px">'+(VI[k]||'')+'</span> '+esc(k)+'　<span class="mu">'+v.n+' 筆</span>',money(v.s)))}</div></main><div class="bar"><button onclick="reportPdf()">匯出月報 PDF</button></div>`}
async function reportPdf(){
 if(!window.html2canvas||!window.jspdf){alert('PDF 元件尚未載入，請檢查網路後再試');return}
 const R_=RP,r1=n=>Math.round(n*10)/10;
 const tb=(h,rs)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rs.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;
 const inv=[...R_.os].sort((a,b)=>a.date.localeCompare(b.date)||a.no.localeCompare(b.no));
 $('#sheet').innerHTML=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:6px"><img src="${LOGO}" style="height:60px"><h2 style="margin:0">弘越隔熱紙月報　${esc(R_.rm)}</h2></div><div>工單 ${R_.os.length} 筆　總才數 ${r1(R_.cai)} 才　營收 ${money(R_.tot)}（未扣成本）</div>
 <h3>收入組成</h3>${tb(['項目','金額'],[['貼膜材料與施工',money(R_.mat)],['交通費',money(R_.tr)],['拆舊紙',money(R_.rem)],['其他費用 / 工資',money(R_.ex)],['合計',money(R_.tot)],['材料成本',money(R_.cost)],['扣除成本後營收',money(R_.tot-R_.cost)]])}
 <h3>各品牌／型號用量</h3>${tb(['品牌／型號','才數','窗數','金額'],Object.entries(R_.by).sort((a,b)=>b[1].s-a[1].s).map(([k,b])=>[esc(k),r1(b.c),b.n,money(b.s)]))}
 <h3>各車種</h3>${tb(['車種','筆數','金額'],Object.entries(R_.vt).sort((a,b)=>b[1].s-a[1].s).map(([k,v])=>[esc(k),v.n,money(v.s)]))}
 <h3>發票明細</h3>${tb(['日期','工單編號','客戶','發票號碼','金額'],inv.map(o=>[esc(o.date),esc(o.no),esc(o.customer),esc(o.inv||'未填'),money(total(o))]).concat([['','','','合計',money(R_.tot)]]))}`;
 try{
  const c=await h2c();
  const p=new jspdf.jsPDF('p','mm','a4'),pw=190,ph=277,pc=Math.floor(c.width*ph/pw);
  for(let y=0,g=0;y<c.height;y+=pc,g++){
   const s=document.createElement('canvas');s.width=c.width;s.height=Math.min(pc,c.height-y);
   s.getContext('2d').drawImage(c,0,y,c.width,s.height,0,0,c.width,s.height);
   if(g)p.addPage();
   p.addImage(s.toDataURL('image/jpeg',.92),'JPEG',10,10,pw,s.height*pw/c.width)}
  await deliverPdf(p,`月報_${R_.rm}.pdf`);
 }catch(e){if(e.name!=='AbortError')alert('匯出失敗：'+((e&&e.message)||e))}
}
const WARR={'汽車':5,'大卡車':5,'挖土機':2};
const VI={'汽車':'🚗','挖土機':'🚜','大卡車':'🚛','大樓/房子':'🏢'};
let LM={y:today().slice(0,4),m:today().slice(5,7)};
function setLM(k,v){LM[k]=v;list()}
function quick(id,k,ev){ev.stopPropagation();const o=S.orders.find(x=>x.id===id);if(!o)return;cur=JSON.parse(JSON.stringify(o));if(k==='pdf')pdf();else txt(k)}
function filterHtml(yrs,os){return `<div class="card"><div class="row"><select onchange="setLM('y',this.value)"><option value="">全部年份</option>${yrs.map(y=>`<option ${y===LM.y?'selected':''}>${y}</option>`).join('')}</select><select onchange="setLM('m',this.value)"><option value="">全年</option>${Array.from({length:12},(_,k)=>{const m=String(k+1).padStart(2,'0');return `<option value="${m}" ${m===LM.m?'selected':''}>${k+1} 月</option>`}).join('')}</select></div><div class="mu" style="margin-top:8px">共 ${os.length} 筆（1–${os.length}）　合計 ${money(os.reduce((a,o)=>a+total(o),0))}</div></div>`}
function films(){
 $('#app').innerHTML=`<header><button class="s" onclick="go('list')">‹ 返回</button><h1>膜種與單價</h1></header>
 <main><p class="mu">已預載常見品牌，價格預設為 0，請在每列填入「售價」（左）和「成本」（右），單位是元／才；成本只用在月報；沒有的品牌可自行新增。</p>
 ${S.films.map((f,i)=>`<div class="card row"><input value="${esc(f.name)}" oninput="S.films[${i}].name=this.value;save()" style="flex:2"><input type="number" inputmode="decimal" placeholder="售價" value="${esc(f.price)}" oninput="S.films[${i}].price=+this.value||0;save()"><input type="number" inputmode="decimal" placeholder="成本" value="${esc(f.cost)}" oninput="S.films[${i}].cost=+this.value||0;save()"><button class="d" style="flex:0 0 52px" onclick="S.films.splice(${i},1);save();films()">✕</button></div>`).join('')}
 <button class="s" style="width:100%" onclick="S.films.push({name:'新膜種',price:0});save();films()">＋ 新增膜種</button></main>`;
}

function summary(o){
 const ws=o.windows.filter(w=>w.on);
 return `【弘越隔熱紙 施工單】\n客戶：${o.customer} ${o.phone}${o.lineId?'\nLINE ID：'+o.lineId:''}\n編號：${o.no}${o.inv?'\n發票：'+o.inv:''}\n日期：${o.date}\n${o.type}：${vehLabel(o)} ${o.subject}\n`+
 ws.map(w=>`${w.name}｜${w.film} ${w.model||''} ${w.pct?w.pct+'%':''}｜${w.cai}才×${w.price}＝${money(w.cai*w.price)}`).join('\n')+
 (o.travel?`\n交通費：${money(o.travel)}`:'')+(o.removal?`\n拆舊紙：${money(o.removal)}`:'')+(o.extra?`\n其他費用：${money(o.extra)}`:'')+`\n合計：${money(total(o))}`+(o.note?`\n備註：${o.note}`:'');
}
function txt(k){
 const t=summary(cur);
 if(k==='line'){
  if(window.self!==window.top)alert('目前是在預覽視窗內，手機會擋住開啟 LINE。請改用你的網站網址開啟，才能直接跳到 LINE。');
  goUrl('line://msg/text/'+encodeURIComponent(t));
  setTimeout(()=>{if(!document.hidden)goUrl('https://line.me/R/msg/text/?'+encodeURIComponent(t))},1800);
  return}
 goUrl('mailto:?subject='+encodeURIComponent('弘越隔熱紙 施工單 '+cur.customer)+'&body='+encodeURIComponent(t));
}
function goUrl(u){const a=document.createElement('a');a.href=u;a.target='_top';a.rel='noopener';a.style.display='none';document.body.appendChild(a);a.click();a.remove()}
const h2c=()=>html2canvas($('#sheet'),{scale:2,backgroundColor:'#fff',scrollX:0,scrollY:0,windowWidth:720,onclone:d=>{const e=d.getElementById('sheet');e.style.left='0';e.style.top='0';e.style.position='absolute'}});
function closePs(){const e=document.getElementById('ps');if(e)e.remove()}
function showPdfSheet(blob,f,name){
 closePs();const url=URL.createObjectURL(blob);
 const d=document.createElement('div');d.id='ps';
 d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end';
 d.innerHTML=`<div style="background:var(--card);width:100%;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));border-radius:16px 16px 0 0"><div style="font-weight:700;margin-bottom:4px">PDF 已產生</div><div class="mu" style="margin-bottom:12px;word-break:break-all">${esc(name)}</div><div style="display:flex;flex-direction:column;gap:8px"><button id="psShare">分享 / 傳送（LINE、Email…）</button><a id="psOpen" href="${url}" target="_blank" rel="noopener" style="text-align:center;padding:12px;border:1px solid var(--ac);border-radius:10px;color:var(--ac);text-decoration:none">開啟 PDF 預覽</a><a id="psDl" href="${url}" download="${esc(name)}" style="text-align:center;padding:12px;border:1px solid var(--ac);border-radius:10px;color:var(--ac);text-decoration:none">下載 PDF</a><button class="s" onclick="closePs()">關閉</button></div></div>`;
 document.body.appendChild(d);
 document.getElementById('psShare').onclick=async()=>{try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:name});else alert('這個瀏覽器不支援直接分享，請改用下方「開啟 PDF 預覽」或「下載 PDF」')}catch(e){if(e.name!=='AbortError')alert('分享失敗：'+e.message)}}}
async function deliverPdf(p,name){
 const blob=p.output('blob'),f=new File([blob],name,{type:'application/pdf'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e.name==='AbortError')return}
 showPdfSheet(blob,f,name)}
function genWno(){
 const used=new Set(S.orders.map(o=>o.wno).filter(Boolean));
 for(let k=0;k<50;k++){
  const a=new Uint32Array(2);crypto.getRandomValues(a);
  let n=String(a[0]).padStart(10,'0')+String(a[1]).padStart(10,'0');
  n=String(1+(+n[0]%9))+n.slice(1,13);
  if(!used.has(n))return n}
 return String(Date.now()).padStart(13,'0').slice(-13)}
function ensureWno(o){
 if(!o.wno){o.wno=genWno();const i=S.orders.findIndex(x=>x.id===o.id);if(i>=0&&!S.orders[i].wno){S.orders[i].wno=o.wno;save()}}
 return o.wno}
async function pdf(){
 if(!window.html2canvas||!window.jspdf){alert('PDF 元件尚未載入，請檢查網路後再試');return}
 const o=cur,ws=o.windows.filter(w=>w.on);
 $('#sheet').innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px"><div style="display:flex;align-items:center;gap:14px"><img src="${LOGO}" style="height:72px"><h1 style="margin:0;font-size:26px;line-height:1.2;font-weight:700;letter-spacing:1px;white-space:nowrap">弘越隔熱紙 施工單</h1></div></div>
 <div style="font-size:11px;line-height:1.7;color:#666"><div>客戶：<b style="color:#000">${esc(o.customer)}</b>　電話：<b style="color:#000">${esc(o.phone)}</b>${o.lineId?'　LINE ID：<b style="color:#000">'+esc(o.lineId)+'</b>':''}</div><div>編號：<b style="color:#000">${esc(o.no)}</b>　日期：<b style="color:#000">${esc(o.date)}</b>${o.inv?'　發票：<b style="color:#000">'+esc(o.inv)+'</b>':''}</div><div>${esc(o.type)}：<b style="color:#000">${esc(vehLabel(o))} ${esc(o.subject)}</b></div></div>
 <table><tr><th>窗戶</th><th>貼紙</th><th>才數</th><th>單價</th><th>小計</th></tr>
 ${ws.map(w=>`<tr><td>${esc(w.name)}</td><td>${esc(w.film)} ${esc(w.model)} ${w.pct?esc(w.pct)+'%':''}</td><td>${esc(w.cai)}</td><td>${esc(w.price)}</td><td>${money(w.cai*w.price)}</td></tr>`).join('')}
 ${o.travel?`<tr><td colspan="4">交通費</td><td>${money(o.travel)}</td></tr>`:''}${o.removal?`<tr><td colspan="4">拆舊紙</td><td>${money(o.removal)}</td></tr>`:''}${o.extra?`<tr><td colspan="4">其他費用 / 工資</td><td>${money(o.extra)}</td></tr>`:''}
 <tr><th colspan="4">合計</th><th>${money(total(o))}</th></tr></table><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:14px"><div style="flex:1;min-width:0">${WARR[o.type]?`<div style="display:flex;align-items:baseline;gap:6px;font-size:15px"><b>保固：<span style="color:#dc2626;font-size:17px">${WARR[o.type]} 年</span></b><span style="font-size:11px;color:#555">（自 ${esc(o.date)} 起算）</span></div><div style="margin-top:6px;display:flex;align-items:baseline;gap:8px;white-space:nowrap"><span style="font-size:12px;color:#555">保固號碼：</span><span style="font-size:20px;font-weight:700;letter-spacing:2px;color:#b8860b;font-variant-numeric:tabular-nums">${ensureWno(o)}</span></div>`:''}${o.note?`<p style="margin:10px 0 0">備註：${esc(o.note)}</p>`:''}</div><img src="${SEAL}" style="height:110px;flex:none"></div>`;
 try{
  const c=await h2c();
  const p=new jspdf.jsPDF('p','mm','a4');
  let w=190,h=c.height*w/c.width;if(h>277){w=w*277/h;h=277}
  p.addImage(c.toDataURL('image/jpeg',.92),'JPEG',10,10,w,h);
  await deliverPdf(p,`${o.no}_${o.customer||'未命名'}.pdf`);
 }catch(e){if(e.name!=='AbortError')alert('匯出失敗：'+((e&&e.message)||e)+'\n可改用 LINE / Email 傳送文字版')}
}
function backupHtml(){const t=S.lastBackup?'上次備份：'+S.lastBackup:'尚未備份過';
 return `<div class="card"><b>資料備份</b><div class="mu" style="margin:4px 0 8px">${t}。工單只存在這支手機的瀏覽器裡，請定期備份。</div><div class="row"><button onclick="exportBk()">匯出備份</button><button class="s" onclick="document.getElementById('bkfile').click()">匯入備份</button></div><input id="bkfile" type="file" accept=".json,application/json" style="display:none" onchange="importBk(this)"></div>`}
function exportBk(){
 S.lastBackup=today();save();
 const name='弘越工單備份_'+today().replace(/-/g,'')+'.json';
 const blob=new Blob([JSON.stringify({app:'hongyue',v:1,at:new Date().toISOString(),S})],{type:'application/json'});
 const f=new File([blob],name,{type:'application/json'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).catch(()=>{});list();return}}catch(e){}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();list()}
function importBk(inp){
 const file=inp.files&&inp.files[0];if(!file)return;
 const r=new FileReader();
 r.onload=()=>{try{
  const d=JSON.parse(r.result),B=d&&d.S;
  if(!B||!Array.isArray(B.orders))throw new Error('不是弘越工單的備份檔');
  if(!confirm('備份檔內有 '+B.orders.length+' 筆工單。匯入後會與目前的工單合併，編號相同的工單會以備份檔為準。要繼續嗎？'))return;
  const m=new Map(S.orders.map(o=>[o.id,o]));B.orders.forEach(o=>m.set(o.id,o));S.orders=[...m.values()];
  (B.films||[]).forEach(f=>{if(!S.films.some(x=>x.name===f.name))S.films.push(f)});
  save();list();alert('已匯入，目前共 '+S.orders.length+' 筆工單')
 }catch(e){alert('匯入失敗：'+e.message)}inp.value=''};
 r.readAsText(file)}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
R();
</script>
